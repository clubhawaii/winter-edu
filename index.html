<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>겨울특강 홍보물 만들기 사전 과제 | 클럽하와이</title>
<meta name="description" content="교육 당일 바로 홍보물을 만들 수 있도록 학원 자료를 미리 보내 주세요.">
<!-- 링크 미리보기 (카카오톡 · 문자 · SNS) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="클럽하와이">
<meta property="og:title" content="겨울특강 홍보물 만들기 사전 과제 | 클럽하와이">
<meta property="og:description" content="교육 당일 바로 홍보물을 만들 수 있도록 학원 자료를 미리 보내 주세요.">
<meta property="og:url" content="https://clubhawaii.github.io/winter-edu/">
<meta property="og:image" content="https://clubhawaii.github.io/winter-edu/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="겨울특강 홍보물 · 사전 과제를 제출해주세요">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://clubhawaii.github.io/winter-edu/og-image.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<style>
:root{
  --pink:#FF5F9F; --pink-dark:#F2468C; --ink:#191919; --gray:#595959; --sub:#8A8A8A;
  --line:#E8E8E8; --soft:#FFF7FA; --mute:#C3C3C3; --danger:#E0455E;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:10px;
  --checker:repeating-conic-gradient(#F1F1F1 0 25%,#fff 0 50%) 0 0/12px 12px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:#F4F4F4;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}

/* ═════════════ 모바일 ═════════════ */
.app{position:relative;max-width:520px;min-height:100vh;min-height:100dvh;margin:0 auto;background:#fff}
@media (min-width:560px){.app{box-shadow:0 0 0 1px #EAEAEA}}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;height:60px;padding:0 20px 0 10px;background:#fff}
.back{width:40px;height:40px;display:grid;place-items:center;border:0;background:none;border-radius:8px}
.back:hover{background:#F5F5F5}
.back svg{width:24px;height:24px}
.bar{flex:1;height:6px;border-radius:3px;background:#EDEDED;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--pink);border-radius:3px;transition:width .35s ease}
.save-st{flex:0 0 auto;font-size:12px;font-weight:500;color:var(--sub);white-space:nowrap}
.save-st[data-st=err]{color:var(--danger)}
.upl{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.72);font-size:12px;font-weight:700;color:var(--gray)}
.pend{margin-top:18px!important;padding:12px 14px;border-radius:var(--r);background:var(--soft);font-size:14px!important;color:var(--ink)!important;font-weight:600}
#screen{padding:12px 20px 140px}
.step{animation:inR .28s ease both}
.step.from-left{animation-name:inL}
@keyframes inR{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.q{font-size:24px;font-weight:700;line-height:1.42;letter-spacing:-.02em}
.q em{font-style:normal;color:var(--pink)}
.qs{margin-top:10px;font-size:15px;color:var(--sub);line-height:1.55}
.body{margin-top:28px}
.cta{position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:6;width:100%;max-width:520px;padding:16px 20px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(rgba(255,255,255,0),#fff 28%)}
#next{width:100%;height:56px;border:0;border-radius:var(--r);background:var(--pink);color:#fff;font-size:17px;font-weight:700;transition:background .15s,transform .1s}
#next:hover:not(:disabled){background:var(--pink-dark)}
#next:active:not(:disabled){transform:scale(.99)}
#next:disabled{background:#EDEDED;color:#BDBDBD;cursor:default}

/* ═════════════ 공통 입력 요소 ═════════════ */
.inp{display:block;width:100%;height:56px;padding:0 16px;border:1px solid #DEDEDE;border-radius:var(--r);background:#fff;font-size:17px;outline:none;transition:border-color .15s,box-shadow .15s}
textarea.inp{height:auto;min-height:120px;padding:15px 16px;line-height:1.55;resize:vertical}
.inp::placeholder{color:#B5B5B5}
.inp:focus{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink)}
.inp:disabled{background:#F6F6F6;color:#B0B0B0;border-color:#EDEDED}
.cnt{margin-top:8px;text-align:right;font-size:13px;color:var(--sub)}
.lbl{display:block;font-size:14px;font-weight:600;color:var(--gray);margin:0 0 8px 2px}
.grp + .grp{margin-top:22px}
.row{display:flex;gap:8px}
.row .inp{flex:1;min-width:0}
.btn-sub{flex:0 0 auto;height:56px;padding:0 18px;border:1px solid var(--ink);border-radius:var(--r);background:#fff;font-size:15px;font-weight:700}
.btn-sub:hover{background:var(--ink);color:#fff}
.mt8{margin-top:8px}
.link{border:0;background:none;color:var(--gray);font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:6px}
.link:hover{color:var(--pink)}

/* 선택지 */
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:56px;padding:14px 16px;margin-bottom:10px;border:1px solid var(--line);border-radius:var(--r);background:#fff;font-size:16px;font-weight:500;text-align:left;transition:border-color .15s,background .15s}
.opt:hover{border-color:#D0D0D0}
.opt .ot{display:flex;flex-direction:column;gap:3px}
.opt .ot small{font-size:13px;font-weight:400;color:var(--sub)}
.opt .bx{flex:0 0 22px;width:22px;height:22px;border:1.5px solid #D6D6D6;border-radius:5px;display:grid;place-items:center;transition:all .15s}
.opt .bx svg{width:14px;height:14px;opacity:0}
.opt[aria-pressed=true]{border-color:var(--pink);background:var(--soft)}
.opt[aria-pressed=true] .ot span{font-weight:700}
.opt[aria-pressed=true] .bx{background:var(--pink);border-color:var(--pink)}
.opt[aria-pressed=true] .bx svg{opacity:1}

/* 칩 */
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chips.days{grid-template-columns:repeat(7,1fr);gap:6px}
.chip{height:48px;padding:0 4px;border:1px solid var(--line);border-radius:var(--r);background:#fff;font-size:15px;font-weight:600;transition:all .15s}
.chip:hover{border-color:#CFCFCF}
.chip[aria-pressed=true]{border-color:var(--pink);background:var(--soft);color:var(--pink);font-weight:700}
.chip:disabled{opacity:.4;cursor:default}
.cg + .cg{margin-top:18px}
.cg h4{font-size:14px;font-weight:600;color:var(--gray);margin:0 0 8px 2px}

/* 정해진 것만 */
.drow + .drow{margin-top:22px}
.dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.dh .lbl{margin:0 0 0 2px}
.tbd{height:32px;padding:0 13px;border:1px solid #DADADA;border-radius:16px;background:#fff;font-size:13px;font-weight:600;color:var(--gray);transition:all .15s}
.tbd[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}

/* 학원 정보 카드 */
.icard{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ilogo{position:relative;height:128px;display:grid;place-items:center;background:var(--checker);border-bottom:1px solid var(--line)}
.ilogo img{max-width:70%;max-height:88px;object-fit:contain}
.ilogo .nologo{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 20px;border:1.5px dashed #CFCFCF;border-radius:var(--r);background:#fff;font-size:14px;font-weight:700;color:var(--gray);cursor:pointer}
.ilogo .nologo small{font-weight:500;color:var(--sub);font-size:12px}
.ilogo .nologo input,.ilogo .swap input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ilogo .swap{position:absolute;right:10px;bottom:10px;padding:5px 10px;border-radius:6px;background:rgba(255,255,255,.92);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--gray);cursor:pointer}
.icard dl{padding:4px 18px}
.icard dl div{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid #F1F1F1;font-size:15px}
.icard dl div:last-child{border-bottom:0}
.icard dt{flex:0 0 64px;color:var(--sub)}
.icard dd{flex:1;min-width:0;font-weight:600}
.edit-open{margin-top:12px}

/* 업로드 */
.upload{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;min-height:140px;border:1.5px dashed #D0D0D0;border-radius:var(--r);background:#FAFAFA;text-align:center;transition:all .15s;cursor:pointer}
.upload:hover,.upload.over{border-color:var(--pink);background:var(--soft)}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}
.upload .ic{width:44px;height:44px;border-radius:50%;background:var(--pink);display:grid;place-items:center;margin-bottom:6px}
.upload .ic svg{width:20px;height:20px}
.upload strong{font-size:16px;font-weight:700}
.upload span{font-size:13px;color:var(--sub)}
.logo-row{display:flex;align-items:center;gap:14px;padding:12px;border:1px solid var(--line);border-radius:var(--r)}
.logo-row .th{flex:0 0 80px;height:60px;border-radius:6px;display:grid;place-items:center;overflow:hidden;background:var(--checker)}
.logo-row .th img{max-width:100%;max-height:100%;object-fit:contain}
.logo-row .mt{flex:1;min-width:0;font-size:14px;color:var(--sub)}
.logo-row .mt strong{display:block;color:var(--ink);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick{position:relative;display:inline-block}
.pick input{position:absolute;inset:0;opacity:0;cursor:pointer}

.flist .fr{display:flex;align-items:center;gap:12px;padding:10px 6px 10px 10px;margin-bottom:8px;border:1px solid var(--line);border-radius:var(--r)}
.fr .th{flex:0 0 46px;height:46px;border-radius:6px;overflow:hidden;display:grid;place-items:center;background:#F3F3F3;font-size:11px;font-weight:800;color:var(--gray)}
.fr .th img{width:100%;height:100%;object-fit:cover}
.fr .mt{flex:1;min-width:0;font-size:13px;color:var(--sub)}
.fr .mt strong{display:block;color:var(--ink);font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr .x{flex:0 0 40px;height:40px;border:0;background:none;color:#B0B0B0;font-size:20px}
.fr .x:hover{color:var(--danger)}
.addfile{position:relative;display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border:1.5px dashed #CFCFCF;border-radius:var(--r);background:#FAFAFA;color:var(--gray);font-size:15px;font-weight:700;cursor:pointer;transition:all .15s;text-align:center;padding:10px}
.addfile:hover,.addfile.over{border-color:var(--pink);color:var(--pink);background:var(--soft)}
.addfile input{position:absolute;inset:0;opacity:0;cursor:pointer}
.fhint{margin-top:8px;font-size:13px;color:var(--sub)}
.fhint.fh-top{margin:-2px 0 10px 2px}
.or{display:flex;align-items:center;gap:12px;margin:26px 0 14px;font-size:13px;font-weight:600;color:var(--sub)}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#F2F2F2}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .n{position:absolute;left:6px;top:6px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:rgba(25,25,25,.75);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.tile .del{position:absolute;right:6px;top:6px;width:26px;height:26px;border:0;border-radius:50%;background:rgba(25,25,25,.75);color:#fff;font-size:15px;line-height:1}
.tile.add-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1.5px dashed #D0D0D0;background:#FAFAFA;color:var(--gray);font-size:13px;font-weight:600;cursor:pointer}
.tile.add-tile:hover{border-color:var(--pink);color:var(--pink)}
.tile.add-tile b{font-size:26px;font-weight:400;line-height:1}
.tile.add-tile input{position:absolute;inset:0;opacity:0;cursor:pointer}
.count{margin-top:12px;font-size:14px;color:var(--sub)}
.count b{color:var(--pink)}

/* 시작 화면 */
.intro h1{font-size:32px;font-weight:800;line-height:1.3;letter-spacing:-.03em}
.intro h1 em{font-style:normal;color:var(--pink)}
.intro .lead{margin-top:10px;font-size:16px;font-weight:600;color:var(--gray)}
.must{margin-top:28px;padding:20px;border-radius:var(--r);background:var(--soft)}
.must strong{display:block;font-size:18px;font-weight:800;color:var(--pink)}
.must p{margin-top:8px;font-size:15px;line-height:1.65}
.must p b{font-weight:700}
.must .easy{display:flex;align-items:flex-start;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid #FBD9E7;font-weight:700}
.must .easy .ck{flex:0 0 20px;height:20px;margin-top:2px;border-radius:50%;background:var(--pink);display:grid;place-items:center}
.must .easy .ck svg{width:12px;height:12px}
.info{margin-top:24px;border-top:1px solid var(--line)}
.info div{display:flex;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line);font-size:15px}
.info dt{flex:0 0 72px;color:var(--sub);font-weight:500}
.info dd{font-weight:600}
.info .dl dd{color:var(--pink);font-weight:700}
.prep{margin-top:32px}
.prep h2{font-size:17px;font-weight:700}
.prep ul{list-style:none;margin-top:10px}
.prep li{position:relative;display:flex;align-items:center;gap:12px;padding:11px 0;font-size:15px;font-weight:600}
.prep li:not(:last-child)::after{content:"";position:absolute;left:13.5px;top:39px;bottom:-11px;width:1px;background:#D6D6D6}
.prep li i{flex:0 0 28px;height:28px;border-radius:50%;background:var(--ink);display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700;color:#fff}
.resume{margin-top:24px;font-size:14px;color:var(--sub)}
.resume .link{padding:0 0 0 4px}

/* 확인 화면 */
.rv section{padding:20px 0;border-bottom:8px solid #F5F5F5}
.rv section:last-child{border-bottom:0}
.rv h2{font-size:17px;font-weight:700;margin-bottom:8px}
.rv .r{display:flex;align-items:flex-start;gap:10px;padding:9px 0;font-size:15px}
.rv .r dt{flex:0 0 92px;color:var(--sub)}
.rv .r dd{flex:1;min-width:0;font-weight:500;white-space:pre-line}
.rv .r dd.miss{color:var(--danger);font-weight:600}
.rv .r dd.none{color:var(--mute)}
.rv .r .link{flex:0 0 auto;padding:0 2px;font-size:13px}
.rv .thumbs{display:flex;gap:6px;flex-wrap:wrap}
.rv .thumbs img{width:56px;height:56px;object-fit:cover;border-radius:6px;background:var(--checker)}
.rv .thumbs img.lg{object-fit:contain}

/* 완료 */
.done{padding-top:56px;text-align:center}
.done .ok{width:72px;height:72px;margin:0 auto 24px;border-radius:50%;background:var(--pink);display:grid;place-items:center;animation:pop .4s ease both}
.done .ok svg{width:34px;height:34px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.done h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.done p{margin-top:12px;font-size:16px;color:var(--gray);line-height:1.6}
.done .info{text-align:left;margin-top:32px}
.edit-box{margin-top:28px}
.btn-edit{width:100%;height:54px;border:1.5px solid var(--ink);border-radius:var(--r);background:#fff;font-size:16px;font-weight:700;transition:all .15s}
.btn-edit:hover{background:var(--ink);color:#fff}
.edit-box p{margin-top:10px!important;font-size:13px!important;color:var(--sub)!important}
.rv .thumbs .ph{width:56px;height:56px;border-radius:6px;background:#EDEDED}

/* 실습 자료 */
.kit{margin-top:32px;padding:22px 18px 18px;border:1.5px solid var(--ink);border-radius:12px;text-align:left}
.kit h2{font-size:19px;font-weight:800;letter-spacing:-.02em}
.kit .kit-lead{margin-top:6px;font-size:14px;color:var(--gray);line-height:1.6}
.kit.temp{margin-top:28px;background:#fff}
.kit.temp h2{font-size:18px;line-height:1.45}
.kit.temp .kit-lead{font-size:15px;color:var(--ink);font-weight:600}
.loadbar{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--ink);color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.loadbar[hidden]{display:none}
.lb-in{display:flex;align-items:center;gap:14px;max-width:1080px;margin:0 auto;padding:14px 20px}
.lb-in strong{display:block;font-size:16px;font-weight:700}
.lb-in small{display:block;margin-top:2px;font-size:13px;color:#C9C9C9}
.lb-spin{flex:0 0 26px;width:26px;height:26px;border:3px solid rgba(255,255,255,.25);border-top-color:var(--pink);border-radius:50%;animation:spin .8s linear infinite}
.lb-line{position:absolute;left:0;right:0;bottom:-4px;height:4px;overflow:hidden;background:rgba(255,95,159,.25)}
.lb-line::before{content:"";position:absolute;top:0;bottom:0;width:40%;background:var(--pink);animation:lbmove 1.1s ease-in-out infinite}
@keyframes lbmove{from{left:-40%}to{left:100%}}
body.is-loading{padding-top:70px}
body.is-loading #screen,body.is-loading #pc{opacity:.4;pointer-events:none;transition:opacity .2s}
.handout{display:flex;align-items:center;gap:14px;margin-top:24px;padding:16px 18px;border-radius:12px;background:var(--ink);color:#fff;text-decoration:none;text-align:left;transition:transform .15s,background .15s}
.handout:hover{background:#000;transform:translateY(-1px)}
.handout .ho-ic{flex:0 0 44px;height:44px;border-radius:10px;background:var(--pink);display:grid;place-items:center}
.handout .ho-ic svg{width:24px;height:24px}
.handout .ho-t{flex:1;min-width:0}
.handout small{display:block;font-size:12px;font-weight:600;color:#FF9CC4;letter-spacing:.02em}
.handout strong{display:block;margin-top:2px;font-size:17px;font-weight:800;line-height:1.35}
.handout .ho-go{flex:0 0 auto;padding:8px 12px;border-radius:8px;background:rgba(255,255,255,.12);font-size:13px;font-weight:700;white-space:nowrap}
.done .handout{margin-top:28px}
.kit .kit-note{margin-top:12px;font-size:13px;color:var(--sub);line-height:1.6}
.btn-kit{width:100%;height:54px;margin-top:16px;border:0;border-radius:var(--r);background:var(--pink);color:#fff;font-size:16px;font-weight:700;transition:background .15s}
.btn-kit:hover:not(:disabled){background:var(--pink-dark)}
.btn-kit:disabled{opacity:.7}
.kit-files{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--line)}
.kit-files li{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}
.kit-files .th{flex:0 0 44px;width:44px;height:44px;border-radius:6px;object-fit:cover;background:var(--checker)}
.kit-files .th.lg{object-fit:contain}
.kit-files .tx.xl{background:#1D6F42;font-size:10px}
.kit-files .tx{flex:0 0 44px;height:44px;border-radius:6px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800;letter-spacing:.04em}
.kit-files .mt{flex:1;min-width:0}
.kit-files strong{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kit-files small{display:block;font-size:12px;color:var(--sub)}
.kit-files button{flex:0 0 auto;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px;font-weight:700}
.kit-files button:hover{border-color:var(--ink)}
.kit-txt{margin-top:14px}
.kit-txt summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--gray)}
.kit-txt pre{margin-top:10px;max-height:320px;overflow:auto;padding:14px;border-radius:8px;background:#F7F7F7;font-family:var(--sans);font-size:13px;line-height:1.65;white-space:pre-wrap;word-break:keep-all}
.kit-txt .link{margin-top:8px;font-size:13px}

.overlay{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:rgba(255,255,255,.94);text-align:center;padding:24px}
.overlay.on{display:grid}
.spin{width:40px;height:40px;margin:0 auto 18px;border:4px solid #F0F0F0;border-top-color:var(--pink);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.overlay strong{display:block;font-size:20px;font-weight:700}
.overlay span{display:block;margin-top:6px;font-size:15px;color:var(--sub)}
.toast{position:fixed;left:50%;bottom:96px;z-index:30;width:max-content;max-width:calc(100% - 40px);transform:translate(-50%,10px);padding:12px 18px;border-radius:10px;background:rgba(25,25,25,.92);color:#fff;font-size:14px;font-weight:600;text-align:center;opacity:0;pointer-events:none;transition:all .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* 로고 · 푸터 */
.brand-logo{display:block;height:30px;width:auto;margin-bottom:28px}
.site-foot{margin:40px -20px -140px;padding:18px 20px 158px;border-top:1px solid var(--line);font-size:12px;color:var(--sub);text-align:center}
.site-foot .copy{margin:0}
#screen.nocta{padding-bottom:0}
#screen.nocta .site-foot{margin-bottom:0;padding-bottom:18px}
/* 특강별 입력 */
.ptag{color:var(--ink);font-weight:700}
.opt-t{margin-left:4px;font-size:12px;font-weight:500;color:var(--mute)}
.plist{list-style:none;margin-bottom:20px;padding:6px 16px;border-radius:var(--r);background:#F7F7F7}
.plist li{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:15px;font-weight:600}
.plist li + li{border-top:1px solid #ECECEC}
.plist b{flex:0 0 22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;display:grid;place-items:center}
.ccard{margin-top:20px;padding:4px 28px 8px;border:1px solid var(--line);border-radius:12px}
.chead{display:flex;align-items:center;justify-content:space-between;padding:18px 0 0}
.chead h2{font-size:18px;font-weight:700}
.chead h2 b{color:var(--pink)}
.ccard .fld{padding:20px 0;border-top:0}
.ccard .fld + .fld{border-top:1px solid #F0F0F0}
.add-course{display:flex;align-items:center;justify-content:center;width:100%;height:56px;margin-top:16px;border:1px dashed #CFCFCF;border-radius:12px;background:#fff;font-size:15px;font-weight:700;color:var(--gray)}
.add-course:hover{border-color:var(--pink);color:var(--pink)}

/* ═════════════ PC · 태블릿 (768px 이상) ═════════════ */
body.is-pc{background:#F5F5F6}
body.is-pc .toast{bottom:108px}
.pc-in{max-width:1160px;margin:0 auto;padding:0 32px}
.pc-top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.pc-top .pc-in{display:flex;align-items:center;justify-content:space-between;height:72px}
.brand{display:flex;align-items:center;gap:12px}
.bar-logo{height:20px;width:auto;margin-right:6px}
.pc-foot-wrap{border-top:1px solid var(--line)}
.pc-foot-wrap .site-foot{max-width:1160px;margin:0 auto;padding:22px 32px;background:none;border:0}
.pi-l .brand-logo{height:34px;margin-bottom:36px}
.brand strong{font-size:19px;font-weight:800;letter-spacing:-.02em}
.brand strong em{font-style:normal;color:var(--pink)}
.brand span{font-size:14px;color:var(--sub);font-weight:500}
.prog{display:flex;align-items:center;gap:14px;font-size:14px;color:var(--sub)}
.prog b{color:var(--ink);font-weight:700}
.prog .bar{flex:0 0 180px}
.pc-body{display:grid;grid-template-columns:260px minmax(0,1fr);gap:40px;padding-top:40px;padding-bottom:80px;align-items:start}
.pc-side{position:sticky;top:112px}
.pc-nav{list-style:none}
.pc-nav button{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border:0;border-radius:var(--r);background:none;font-size:16px;font-weight:500;color:var(--sub);text-align:left;transition:background .15s,color .15s}
.pc-nav button:hover{background:#ECECEE;color:var(--ink)}
.pc-nav i{flex:0 0 28px;height:28px;border-radius:50%;border:1.5px solid #D6D6D6;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700;background:#fff}
.pc-nav i svg{width:14px;height:14px}
.pc-nav small{margin-left:auto;font-size:12px;color:var(--mute);font-weight:500}
.pc-nav .ok i{background:var(--pink);border-color:var(--pink)}
.pc-nav .ok{color:var(--ink)}
.pc-nav .cur{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--line)}
.pc-nav .cur i{border-color:var(--ink);color:var(--ink)}
.pc-nav .cur.ok i{border-color:var(--pink)}
.side-note{margin-top:20px;padding:16px 14px 0;border-top:1px solid #E4E4E6;font-size:13px;line-height:1.6;color:var(--sub)}
.side-note b{display:block;margin-bottom:2px;color:var(--pink);font-weight:700}
.pc-main{background:#fff;border:1px solid var(--line);border-radius:14px;padding:44px 48px 0}
.sec-h h1{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.4}
.sec-h h1 em{font-style:normal;color:var(--pink)}
.sec-h p{margin-top:8px;font-size:15px;color:var(--sub)}
#pcFields{margin-top:12px}
.fld{padding:28px 0;border-top:1px solid #F0F0F0;border-radius:4px;transition:background .3s}
#pcFields > .fld:first-child{border-top:0}
.fld.notitle{padding-top:20px}
.fld h3{font-size:17px;font-weight:700}
.fld .fh p{margin-top:4px;font-size:14px;color:var(--sub)}
.fld .fb{margin-top:14px;max-width:640px}
.fld.notitle .fb{margin-top:0}
.ferr{display:none;margin-top:10px;font-size:14px;font-weight:600;color:var(--danger)}
.fld.bad .ferr{display:block}
.fld.bad .inp,.fld.bad .upload,.fld.bad .chip,.fld.bad .add-tile,.fld.bad .addfile,.fld.bad .opt,.fld.bad .nologo{border-color:var(--danger)}
.fld.flash{animation:flash 1.4s ease}
@keyframes flash{0%,40%{background:var(--soft)}100%{background:transparent}}
.pc .st-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:none}
.pc .st-opts .opt{flex-direction:column-reverse;align-items:flex-start;justify-content:flex-end;gap:18px;min-height:148px;padding:20px;margin:0}
.pc .st-opts .opt .ot span{font-size:17px}
.pc .fld .fb:has(.st-opts){max-width:none}
.pc .chips{grid-template-columns:repeat(6,1fr);max-width:640px}
.pc .chips.days{grid-template-columns:repeat(7,1fr)}
.pc .icard{max-width:640px}
.pc .icard .ilogo{height:150px}
.pc-sub{margin-top:12px;padding-top:28px;border-top:1px solid var(--line)}
.pc-sub + .fld{border-top:0;padding-top:20px}
.pc-sub h2{font-size:20px;font-weight:700}
.pc-sub h2 em{font-style:normal;color:var(--pink)}
.pc-sub p{margin-top:4px;font-size:14px;color:var(--sub)}
.pc .rv section{border-bottom-width:1px;border-bottom-color:#F0F0F0}
.pc .rv .r dt{flex-basis:130px}
.pc .rv h2{font-size:18px}
.pc-foot{position:sticky;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;margin:32px -48px 0;padding:18px 48px;background:#fff;border-top:1px solid var(--line);border-radius:0 0 14px 14px}
.btn-o,.btn-p{height:52px;min-width:140px;padding:0 24px;border-radius:var(--r);font-size:16px;font-weight:700;transition:background .15s}
.btn-o{border:1px solid #D6D6D6;background:#fff;color:var(--gray)}
.btn-o:hover{border-color:var(--ink);color:var(--ink)}
.btn-p{border:0;background:var(--pink);color:#fff}
.btn-p:hover:not(:disabled){background:var(--pink-dark)}
.btn-p:disabled{background:#EDEDED;color:#BDBDBD;cursor:default}
.pc-intro{min-height:calc(100vh - 200px);display:flex;justify-content:center;align-items:flex-start;padding:56px 24px 64px}
.pi-card{width:100%;max-width:600px;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pi-l{padding:52px 48px 40px;background:var(--soft)}
.pi-l h1{font-size:48px;font-weight:800;line-height:1.22;letter-spacing:-.03em}
.pi-l h1 em{font-style:normal;color:var(--pink)}
.pi-l .lead{margin-top:14px;font-size:18px;font-weight:600;color:var(--gray)}
.pi-l .must{margin-top:32px;padding:22px 24px;background:#fff;border:1px solid #FBD9E7}
.pi-l .must strong{font-size:20px}
.pi-l .must p{font-size:16px;line-height:1.7}
.pi-r{padding:32px 48px 44px}
.pi-r .info{margin-top:0}
.pi-r .prep{margin-top:32px}
.pi-r .btn-p{width:100%;height:58px;margin-top:32px;font-size:17px}
.pc-done{max-width:640px;margin:72px auto;padding:56px 56px 44px;background:#fff;border:1px solid var(--line);border-radius:16px}
@media (max-width:1023px){
  .pc-in{padding:0 24px}
  .brand span{display:none}
  .prog .bar{flex-basis:120px}
  .pc-body{grid-template-columns:200px minmax(0,1fr);gap:24px;padding-top:28px}
  .pc-nav button{padding:12px 10px;font-size:15px;gap:10px}
  .pc-nav small{display:none}
  .pc-main{padding:36px 32px 0}
  .pc-foot{margin:28px -32px 0;padding:16px 32px}
  .pc .st-opts{grid-template-columns:1fr;gap:0}
  .pc .st-opts .opt{flex-direction:row;align-items:center;justify-content:space-between;min-height:56px;padding:14px 16px;margin-bottom:10px}
  .pc .chips{grid-template-columns:repeat(3,1fr)}
}

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('on'),2800); }
function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }

/* ---------- 작은 부품 ---------- */
function textInput(box, { get, set, ph = '', max, type = 'text', im, fmt, area = false, disabled = false }){
  const e = document.createElement(area ? 'textarea' : 'input');
  e.className = 'inp'; e.placeholder = ph; e.value = get() || ''; e.disabled = disabled;
  if (!area) { e.type = type; if (im) e.inputMode = im; e.enterKeyHint = 'next'; }
  if (max) e.maxLength = max;
  box.appendChild(e);
  let cnt; if (max) { cnt = el('p','cnt'); box.appendChild(cnt); }
  const upd = () => { if (cnt) cnt.textContent = `${e.value.length} / ${max}`; };
  e.addEventListener('input', () => { if (fmt) e.value = fmt(e.value); set(e.value); upd(); changed(); });
  upd();
  return e;
}
function label(box, text){ box.appendChild(el('label','lbl',esc(text))); }

function optionRow(title, desc, pressed, onClick){
  const b = el('button','opt',`<span class="ot"><span>${esc(title)}</span>${desc?`<small>${esc(desc)}</small>`:''}</span><span class="bx">${CHECK}</span>`);
  b.type = 'button'; b.setAttribute('aria-pressed', pressed);
  b.addEventListener('click', onClick);
  return b;
}

/* 여러 개 고르는 칩 (TBD는 다른 선택과 함께 쓸 수 없음) */
function chipSet(box, options, arr, { cls = '', exclusive } = {}){
  const wrap = el('div', 'chips ' + cls); box.appendChild(wrap);
  options.forEach(o => {
    const b = el('button','chip',esc(o)); b.type='button'; b.dataset.v = o;
    wrap.appendChild(b);
  });
  const sync = () => $$('.chip', wrap).forEach(b => b.setAttribute('aria-pressed', arr().includes(b.dataset.v)));
  wrap.addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b || b.disabled) return;
    const v = b.dataset.v, a = arr();
    const i = a.indexOf(v);
    if (i > -1) a.splice(i, 1);
    else { if (exclusive && v === exclusive) a.splice(0); else if (exclusive) { const j = a.indexOf(exclusive); if (j > -1) a.splice(j, 1); } a.push(v); }
    syncAll(); changed();
  });
  const syncAll = () => { $$('.chips', box).forEach(w => w._sync && w._sync()); };
  wrap._sync = sync; sync();
  return wrap;
}

function fmtPhone(v){
  const d = v.replace(/\D/g, '').slice(0, 12);
  if (/^1[5-9]/.test(d)) return d.length > 4 ? d.slice(0,4)+'-'+d.slice(4,8) : d;
  if (d.startsWith('02')) {
    if (d.length <= 2) return d;
    if (d.length <= 5) return d.slice(0,2)+'-'+d.slice(2);
    if (d.length <= 9) return d.slice(0,2)+'-'+d.slice(2,5)+'-'+d.slice(5);
    return d.slice(0,2)+'-'+d.slice(2,6)+'-'+d.slice(6,10);
  }
  if (/^050/.test(d) && d.length > 11) return d.slice(0,4)+'-'+d.slice(4,8)+'-'+d.slice(8);
  if (d.length <= 3) return d;
  if (d.length <= 6) return d.slice(0,3)+'-'+d.slice(3);
  if (d.length <= 10) return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);
  return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7,11);
}
const ext = n => (String(n).split('.').pop() || 'FILE').toUpperCase().slice(0, 4);
function dragUI(e){
  ['dragenter','dragover'].forEach(ev => e.addEventListener(ev, () => e.classList.add('over')));
  ['dragleave','drop'].forEach(ev => e.addEventListener(ev, () => e.classList.remove('over')));
}

function setLogoFile(f){
  if (!f) return false;
  if (f.size > CONFIG.LOGO_MAX_MB * 1048576) { toast(`로고 파일은 ${CONFIG.LOGO_MAX_MB}MB 이하로 올려주세요.`); return false; }
  if (logo && logo.file) URL.revokeObjectURL(logo.url);
  logo = { file:f, url:URL.createObjectURL(f), name:f.name, size:f.size, mimeType:f.type, prefilled:false };
  uploadItem(logo, 'logo');
  return true;
}

    qsub: () => '',
    title: '', err: '슬로건과 강조하고 싶은 말을 모두 적어주세요.',
    mount(box){
      box.innerHTML = '';
      const g1 = el('div','grp'); box.appendChild(g1); label(g1, '학원의 슬로건');
      g1.appendChild(el('p','fhint fh-top','학원을 한 문장으로 소개하는 말이에요. 지금 쓰고 계신 문구가 있다면 그대로 적어주세요.'));
      textInput(g1, { get:()=>S.slogan, set:v=>S.slogan=v, ph:'예) 생각하는 힘을 키우는 수학', max:60 });
      const g2 = el('div','grp'); box.appendChild(g2); label(g2, '이번 특강에서 꼭 강조하고 싶은 말');
      g2.appendChild(el('p','fhint fh-top','학부모님께 이번 겨울특강에서 꼭 전하고 싶은 한마디예요.'));
      textInput(g2, { get:()=>S.emphasis, set:v=>S.emphasis=v, ph:'예) 소수 정예 8명, 매 수업 테스트', max:100 });
    },

  },

  review: {
    q: () => '보내실 내용을<br><em>확인</em>해주세요',
    qsub: () => editMode ? '고칠 항목의 ‘수정’을 누르고, 마지막에 ‘수정 내용 제출하기’를 눌러주세요.' : '고칠 내용이 있다면 ‘수정’을 눌러주세요.',
    title: '',
    mount(box){
      const row = (lbl, val, go, { html, need = true } = {}) => {
        const has = html || filled(val);
        const cls = has ? '' : need ? 'miss' : 'none';
        return `<div class="r"><dt>${lbl}</dt><dd class="${cls}">${html || (has ? esc(val) : need ? '입력이 필요해요' : '없음')}</dd><button type="button" class="link" data-go="${go}">수정</button></div>`;
      };
      const tb = (v, t) => t ? '미정' : v;
      let h = `<div class="rv"><section><h2>학원 정보</h2><dl>`;
      h += row('로고', '', 'info', { html: logo ? `<div class="thumbs">${logoIsImg() ? `<img class="lg" src="${logo.url}" alt="">` : esc(logo.name)}</div>` : '' });
      h += row('학원명', S.academyName, 'info');
      h += row('주소', [S.address, S.addressDetail].filter(filled).join(' '), 'info');
      h += row('전화번호', S.phone, 'info');
      h += `</dl></section><section><h2>겨울방학 특강</h2><dl>`;
      h += row('준비 상황', S.status ? STATUS[S.status][0] : '', 'status');
      if (S.status === 'ready' || S.status === 'lastyear') {
        h += row(S.status === 'lastyear' ? '작년 자료' : '안내 자료', docs.map(d => d.name).join('\n'), 'files', { need: !filled(S.courseText) });
        if (filled(S.courseText)) h += row('붙여넣은 글', S.courseText.length > 140 ? S.courseText.slice(0, 140) + '…' : S.courseText, 'files');

      if (S.status === 'planning' || S.status === 'lastyear') {
        S.plans.forEach((P, i) => {

          h += row('대상', P.targets.join(', '), `p-basic:${i}`);
          h += row('기간', tb(P.period, P.periodTbd), `p-detail:${i}`);
          h += row('요일', tb(P.days.join(', '), P.daysTbd), `p-detail:${i}`);
          h += row('시간', tb(P.time, P.timeTbd), `p-detail:${i}`);
          h += row('수강료', tb(P.fee, P.feeTbd), `p-detail:${i}`);
          h += row('생각 중인 내용', P.memo, `p-detail:${i}`, { need:false });

      }
      h += `</dl></section><section><h2>학원 사진</h2><dl>`;
      h += row('사진', '', 'photos', { html: photos.length >= CONFIG.PHOTO_MIN ? `<div class="thumbs">${photos.map(p => p.url ? `<img src="${p.url}" alt="">` : '<span class="ph"></span>').join('')}</div>` : '' });
      h += `</dl></section><section><h2>학원의 메시지</h2><dl>`;

      h += row('강조하고 싶은 말', S.emphasis, 'message');

      box.innerHTML = h;
      $$('[data-go]', box).forEach(b => b.addEventListener('click', () => { toReview = true; go(b.dataset.go); }));
    },
    valid: () => requiredIds().every(id => okId(id)),
    cta: () => editMode ? '수정 내용 제출하기' : '제출하기'
  }
};
const val = (v) => typeof v === 'function' ? v() : v;
const typeOf = id => String(id).split(':')[0];
const idxOf = id => +(String(id).split(':')[1] || 0);
const defOf = id => C[typeOf(id)];
const okId = id => defOf(id).valid(idxOf(id));
function planName(i){
  const P = S.plans[i]; if (!P) return '';
  const subj = P.subjects.map(s => s === '기타' && filled(P.subjectEtc) ? P.subjectEtc : s).join('·');
  return [subj, P.targets.join('·')].filter(Boolean).join(' · ') || `특강 ${i + 1}`;
}
const planIds = more => S.plans.flatMap((_, i) => more ? [`p-basic:${i}`, `p-detail:${i}`, `p-more:${i}`] : [`p-basic:${i}`, `p-detail:${i}`]);
function courseIds(more){
  if (S.status === 'ready') return ['files'];
  if (S.status === 'planning') return planIds(more);
  if (S.status === 'lastyear') return ['files', ...planIds(more)];
  return [];
}
const requiredIds = () => ['info','status',...courseIds(false),'photos','message'];
const normalizeMore = () => S.plans.forEach((P, i) => { P.more = i < S.plans.length - 1; });

function kitRows(){

  if (cur) R.push(['sec', '겨울방학 특강 (클럽하와이 정리)'], ['text', cur.trim()]);
  if (S.status === 'planning' || S.status === 'lastyear') {
    const tb = (v, t) => t ? '미정' : filled(v) ? v.trim() : '';
    S.plans.forEach((P, i) => {
      R.push(['sec', (S.status === 'lastyear' ? '올해 겨울방학 특강 계획' : '겨울방학 특강') + (S.plans.length > 1 ? ` ${i + 1}` : '')]);
      R.push(['kv', '과목', P.subjects.map(x => x === '기타' && filled(P.subjectEtc) ? P.subjectEtc.trim() : x).join(' · ')],
        ['kv', '대상', P.targets.join(' · ')], ['kv', '기간', tb(P.period, P.periodTbd)], ['kv', '요일', tb(P.days.join(' · '), P.daysTbd)],
        ['kv', '시간', tb(P.time, P.timeTbd)], ['kv', '수강료', tb(P.fee, P.feeTbd)]);
      if (filled(P.memo)) R.push(['kv', '수업 내용', P.memo.trim()]);
    });
  }
  if (filled(S.courseText)) R.push(['sec', '원장님이 붙여 넣은 특강 안내 글'], ['text', S.courseText.trim()]);
  R.push(['sec', '함께 올리는 파일']);
  files.slice(1).forEach(f => R.push(['kv', f.name, f.desc]));
  return R.filter(r => r[0] !== 'kv' || filled(r[2]));   // 원장님이 안 적은 칸은 아예 넣지 않음
}
function rowsText(R){
  const L = [];
  R.forEach(([t, a, b]) => {
    if (t === 'title') L.push(`[${a}]`, '');
    else if (t === 'note') L.push(a);
    else if (t === 'sec') L.push('', '', `■ ${a}`);
    else if (t === 'kv') L.push(`${a}: ${b || ''}`);
    else L.push(a);
  });
  return L.join('\n').trim() + '\n';
}
const kitText = () => rowsText(kitRows());
let excelP = null;
function loadExcel(){
  if (window.ExcelJS) return Promise.resolve();
  return excelP || (excelP = new Promise((ok, no) => {
    const sc = document.createElement('script'); sc.src = CONFIG.EXCELJS_URL; sc.onload = ok;
    sc.onerror = () => { excelP = null; no(new Error('excel')); }; document.head.appendChild(sc);
  }));
}
/** 줄 목록 → 엑셀(.xlsx). 엑셀을 못 불러오면 같은 내용의 글 파일(.txt)로 */
/** 줄 목록 → AI가 바로 읽는 표 형태의 엑셀
 *  · 1행은 머리글(항목 | 내용), 2행부터 한 줄에 정보 하나
 *  · 병합한 칸 · 빈 줄 · 제목 줄이 없어서 표로 그대로 읽혀요 */
function rowsTable(R){
  const T = []; let sec = '';
  R.forEach(([t, a, b]) => {
    if (t === 'sec') { sec = a; return; }
    const m = sec.match(/특강(?: 계획)? (\d+)$/);   // 특강이 여러 개면 항목 앞에 번호
    if (t === 'kv') T.push([m ? `특강 ${m[1]} ${a}` : a, b]);
    else if (t === 'text') T.push([sec, a]);
  });
  return T;
}
async function rowsFile(R){
  try { await loadExcel(); } catch (e) { return new Blob(['﻿' + rowsText(R)], { type:'text/plain;charset=utf-8' }); }
  const wb = new ExcelJS.Workbook(); wb.creator = '클럽하와이';
  const ws = wb.addWorksheet('학원자료', { views:[{ state:'frozen', ySplit:1 }], pageSetup:{ paperSize:9, orientation:'portrait', fitToPage:true, fitToWidth:1, fitToHeight:0 } });
  ws.columns = [{ header:'항목', key:'k', width:30 }, { header:'내용', key:'v', width:80 }];
  const lines = (v, w) => String(v || '').split('\n').reduce((n, l) => n + Math.max(1, Math.ceil(l.length / w)), 0);
  rowsTable(R).forEach(r => {
    const row = ws.addRow(r);
    row.alignment = { vertical:'top', wrapText:true };
    row.height = Math.max(20, 16 * Math.max(lines(r[0], 15), lines(r[1], 38)) + 4);
  });
  const head = ws.getRow(1);
  head.font = { bold:true }; head.height = 22;
  head.eachCell(c => { c.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FFEDEDED' } }; c.alignment = { vertical:'middle' }; });
  ws.autoFilter = 'A1:B1';
  return new Blob([await wb.xlsx.writeBuffer()], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}
const fileName = (f, blob) => /^text\//.test(blob.type) ? f.name.replace(/\.xlsx$/, '.txt') : f.name;

const b64Blob = (b64, type) => { const bin = atob(b64), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type }); };
async function kitBlob(f){
  if (f.kind === 'xls') return rowsFile(kitRows());
  const it = f.item;
  if (it.file) return it.file;
  if (it.fileId && CONFIG.SCRIPT_URL && (S.code || submission)) {
    try {
      const who = S.code ? `code=${encodeURIComponent(S.code)}` : `sid=${encodeURIComponent(submission.submitId)}&token=${encodeURIComponent(submission.token)}`;
      const out = await (await fetch(`${CONFIG.SCRIPT_URL}?app=prework&file=${encodeURIComponent(it.fileId)}&${who}`)).json();
      if (out.ok && out.data) return b64Blob(out.data, out.mimeType || '');
    } catch (e) { console.warn(e); }
  }
  if (it.url && f.kind !== 'doc') return await (await fetch(it.url)).blob();   // 원본을 못 받으면 미리보기 이미지라도
  throw new Error('no file');
}
function saveBlob(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
async function kitSave(i, btn){
  const f = kitFiles()[i], label = btn.textContent;
  btn.disabled = true; btn.textContent = '받는 중…';
  try { const bl = await kitBlob(f); saveBlob(bl, fileName(f, bl)); btn.textContent = '받았어요'; }
  catch (e) { toast(`${f.name} 파일을 받지 못했어요. 잠시 뒤 다시 눌러주세요.`); btn.textContent = label; }
  finally { btn.disabled = false; }
  return btn.textContent === '받았어요';
}
function bindKit(root){
  $$('[data-kit]', root).forEach(b => b.addEventListener('click', () => kitSave(+b.dataset.kit, b)));
  const all = $('#kitAll', root);
  if (all) all.addEventListener('click', async () => {
    const btns = $$('[data-kit]', root), label = all.textContent; let ok = 0;
    all.disabled = true;
    for (let i = 0; i < btns.length; i++) {
      all.textContent = `받는 중… ${i + 1} / ${btns.length}`;
      if (await kitSave(i, btns[i])) ok++;
      await new Promise(r => setTimeout(r, 450));
    }
    all.disabled = false; all.textContent = ok === btns.length ? '모두 받았어요 · 다시 받기' : label;
  });
  const cp = $('#kitCopy', root);

  });
}

const showTemp = () => remoteReady && !submission && !loading;
function tempHTML(){
  if (!showTemp()) return '';
  const files = tempFiles();
  return `<section class="kit temp">
    <h2>원장님 사전 과제 제출이 되지 않았어요.</h2>
    <p class="kit-lead">실습 진행할 수 있는 임시 데이터 파일로 진행해주세요.</p>
    <button type="button" class="btn-kit" id="tmpAll">임시 실습 자료 모두 받기 (${files.length}개)</button>
    <ul class="kit-files">${files.map((f, i) => `<li>${f.kind === 'xls' ? '<span class="tx xl">XLSX</span>' : `<img class="th${f.kind === 'logo' ? ' lg' : ''}" src="${typeof f.url === 'function' ? f.url() : f.url}" alt="">`}<div class="mt"><strong>${esc(f.name)}</strong><small>${esc(f.desc)}</small></div><button type="button" data-tmp="${i}">받기</button></li>`).join('')}</ul>
    <details class="kit-txt"><summary>임시 학원자료 내용 미리 보기</summary><pre>${esc(TEMP_TEXT)}</pre></details>
    <p class="kit-note">교육 날 노트북에서 받아 Claude 대화창에 한 번에 올려 주세요. 교육 전까지 사전 과제를 제출하시면 원장님 학원 자료로 실습할 수 있어요.</p>
  </section>`;
}
async function tempSave(i, btn){
  const f = tempFiles()[i], label = btn.textContent;
  btn.disabled = true;
  try {
    const blob = f.kind === 'xls' ? await rowsFile(TEMP_ROWS)
      : await (await fetch(typeof f.url === 'function' ? f.url() : f.url)).blob();
    saveBlob(blob, fileName(f, blob)); btn.textContent = '받았어요'; return true;
  } catch (e) { toast(`${f.name} 파일을 받지 못했어요. 다시 눌러주세요.`); btn.textContent = label; return false; }
  finally { btn.disabled = false; }
}
function bindTemp(root){
  $$('[data-tmp]', root).forEach(b => b.addEventListener('click', () => tempSave(+b.dataset.tmp, b)));
  const all = $('#tmpAll', root);
  if (all) all.addEventListener('click', async () => {
    const btns = $$('[data-tmp]', root); let ok = 0; all.disabled = true;
    for (let i = 0; i < btns.length; i++) { all.textContent = `받는 중… ${i + 1} / ${btns.length}`; if (await tempSave(i, btns[i])) ok++; await new Promise(r => setTimeout(r, 450)); }
    all.disabled = false; all.textContent = ok === btns.length ? '모두 받았어요 · 다시 받기' : `임시 실습 자료 모두 받기 (${btns.length}개)`;
  });
}

const handoutHTML = () => CONFIG.HANDOUT_URL ? `<a class="handout" href="${CONFIG.HANDOUT_URL}" target="_blank" rel="noopener">
    <span class="ho-ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg></span>
    <span class="ho-t"><small>강의 자료</small><strong>바이브 디자인 워크숍 핸드아웃</strong></span><span class="ho-go">열기 ↗</span></a>` : '';

function doneHTML(){

  ${pendingEdit ? '<p class="pend">제출한 뒤 고치던 내용이 저장돼 있어요. ‘수정 내용 제출하기’를 눌러야 반영돼요.</p>' : ''}
  ${kitHTML()}
  <div class="edit-box"><button type="button" class="btn-edit" id="editBtn">${pendingEdit ? '고치던 내용 이어서 하기' : '제출한 내용 수정하기'}</button><p>${where}</p></div>
  <dl class="info">
    <div><dt>교육 일시</dt><dd>${esc(CONFIG.EDU_DATE)}</dd></div>
    <div><dt>장소</dt><dd>${esc(CONFIG.EDU_PLACE)}</dd></div>
    <div><dt>준비물</dt><dd>노트북, Claude 계정(Pro 이상)</dd></div>
  </dl></div>`;

function bindDone(root){
  bindKit(root);
  const b = $('#editBtn', root); if (!b) return;
  b.addEventListener('click', () => {
    editMode = true; toReview = false; pcToReview = false; cur = 'review'; pcSec = 4;
    if (isPC()) { pcSec = 4; applyMode(); pcRender(); window.scrollTo(0, 0); }

/* ═════════════ 모바일 화면 ═════════════ */
let cur = 'intro', current = null, toReview = false;
const screen = $('#screen'), nextBtn = $('#next');
const mobileSteps = () => ['intro','info','status',...courseIds(true),'photos','message','review'];

function render(dir = 'right'){
  screen.classList.remove('nocta');
  const steps = mobileSteps();
  let idx = steps.indexOf(cur); if (idx < 0) { idx = 0; cur = 'intro'; }
  const wrap = el('div', 'step' + (dir === 'left' ? ' from-left' : ''));
  const body = el('div');
  if (cur === 'intro') {
    wrap.classList.add('intro');
    const p = introParts(); body.innerHTML = p.head + p.temp + p.must + p.info + p.prep + p.resume + footerHTML();
    wrap.appendChild(body); screen.replaceChildren(wrap); bindRestart(body); bindTemp(body);
  } else {
    const c = defOf(cur), i = idxOf(cur), sub = c.qsub ? c.qsub(i) : '';
    wrap.innerHTML = `<h1 class="q">${c.q(i)}</h1>${sub ? `<p class="qs">${sub}</p>` : ''}`;
    body.className = 'body'; wrap.appendChild(body); screen.replaceChildren(wrap);
    c.mount(body, i);
  }
  current = body;
  $('#top').style.visibility = idx === 0 ? 'hidden' : 'visible';
  $('#bar').style.width = `${Math.round(idx / (steps.length - 1) * 100)}%`;
  $('#cta').hidden = false;
  refresh();
  window.scrollTo(0, 0);
  const first = $('input:not([type=file]):not(:disabled), textarea', body);
  if (first && cur !== 'info' && matchMedia('(hover:hover)').matches) setTimeout(() => first.focus({ preventScroll:true }), 280);
  scheduleSave();
}

function refresh(){
  if (isPC()) return pcChanged();
  if (cur === 'intro') { nextBtn.disabled = loading; nextBtn.textContent = startLabel(); return; }
  const c = defOf(cur); if (!c) return;
  const i = idxOf(cur);
  nextBtn.disabled = !c.valid(i);
  nextBtn.textContent = (c.cta && c.cta(i)) || (toReview && typeOf(cur) !== 'p-more' ? '확인 화면으로' : '다음');
}
function changed(){ refresh(); scheduleSave(); }

function go(id, dir = 'right'){
  if (isPC()) { if (toReview) { pcToReview = true; toReview = false; } return pcGo(secOf(id), id); }
  cur = id; render(dir);
}

nextBtn.addEventListener('click', () => {
  if (nextBtn.disabled) return;
  if (cur === 'intro') { const t = hasDraft && savedStep && mobileSteps().includes(savedStep) ? savedStep : 'info'; savedStep = null; return go(t); }
  if (cur === 'review') return submit();
  if (cur === 'info' && S.editInfo && C.info.valid()) S.editInfo = false;
  const c = defOf(cur);
  if (c.onNext) { const r = c.onNext(idxOf(cur)); if (r === false) return; if (typeof r === 'string') return go(r); }
  if (toReview) return go('review');
  const steps = mobileSteps();
  go(steps[steps.indexOf(cur) + 1]);
});
$('#back').addEventListener('click', () => {
  if (toReview && cur !== 'review') { toReview = false; return go('review', 'left'); }
  const steps = mobileSteps(), i = steps.indexOf(cur);
  if (i > 0) go(steps[i - 1], 'left');
});
screen.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing || e.target.tagName !== 'INPUT') return;
  e.preventDefault();
  const inputs = $$('input.inp:not(:disabled)', screen), i = inputs.indexOf(e.target);
  if (i > -1 && i < inputs.length - 1) inputs[i + 1].focus();
  else if (!nextBtn.disabled) nextBtn.click();
});

/* ═════════════ PC · 태블릿 화면 ═════════════ */
const mq = matchMedia('(min-width: 768px)');
function isPC(){ return mq.matches; }
const SECTIONS = [
  { title:'학원 정보 확인', h: () => plain(C.info.q()), sub: () => C.info.qsub() },
  { title:'겨울방학 특강', h: () => plain(C.status.q()), sub: () => C.status.qsub() },
  { title:'학원 사진', h: () => plain(C.photos.q()), sub: () => plain(C.photos.qsub()) },
  { title:'학원의 메시지', h: () => plain(C.message.q()), sub: () => C.message.qsub() },
  { title:'확인 및 제출', h: () => plain(C.review.q()), sub: () => C.review.qsub() }
];
const secIds = i => [['info'], ['status', ...courseIds(false)], ['photos'], ['message'], ['review']][i];
const secOk = i => secIds(i).every(okId);
const secOf = id => { const t = typeOf(id); return t === 'intro' ? 'intro' : t === 'info' ? 0 : (t === 'status' || t === 'files' || t.startsWith('p-')) ? 1 : t === 'photos' ? 2 : t === 'message' ? 3 : 4; };
const firstOf = i => ['info','status','photos','message','review'][i];
let pcSec = 'intro', pcToReview = false;

function pcField(id){
  const c = defOf(id), i = idxOf(id), title = val(c.title), sub = c.sub ? c.sub(i) : '';
  const f = el('div', 'fld' + (title ? '' : ' notitle')); f.dataset.id = id;

function drawNav(){
  const nav = $('#pcNav'); if (!nav) return;
  nav.innerHTML = SECTIONS.map((s, i) => {
    const ok = i < 4 && secOk(i);
    return `<li><button type="button" data-s="${i}" class="${i === pcSec ? 'cur' : ''} ${ok ? 'ok' : ''}"><i>${ok ? CHECK : i + 1}</i><span>${s.title}</span>${s.tag ? `<small>${s.tag}</small>` : ''}</button></li>`;
  }).join('');
  $$('button', nav).forEach(b => b.addEventListener('click', () => { pcToReview = false; pcGo(+b.dataset.s); }));
}
const markBad = () => $$('#pcFields .fld[data-id]').forEach(f => f.classList.toggle('bad', !okId(f.dataset.id)));
function pcChanged(){
  drawNav();
  $$('#pcFields .fld.bad').forEach(f => { if (okId(f.dataset.id)) f.classList.remove('bad'); });
  const s = $('#pcStart'); if (s) { s.disabled = loading; s.textContent = startLabel(); }
  const n = $('#pcNext');
  if (n && pcSec === 0) n.textContent = C.info.card() ? '네, 맞아요' : (pcToReview ? '확인 화면으로' : '다음');
}
function pcGo(i, focusId, showErr){
  pcSec = i; pcRender(focusId);
  if (showErr) markBad();
  if (!focusId) window.scrollTo(0, 0);
  scheduleSave();
}

function pcRender(focusId){
  const root = $('#pc');
  if (pcSec === 'done') { root.innerHTML = `<div class="pc-in"><div class="pc-done">${doneHTML()}</div></div><div class="pc-foot-wrap">${footerHTML()}</div>`; bindDone(root); return; }
  if (pcSec === 'intro') {
    const p = introParts();
    root.innerHTML = `<div class="pc-intro"><div class="pi-card">
      <div class="pi-l">${p.head}${p.temp}${p.must}</div>
      <div class="pi-r">${p.info}${p.prep}${p.resume}<button type="button" class="btn-p" id="pcStart"></button></div>
    </div></div><div class="pc-foot-wrap">${footerHTML()}</div>`;
    bindRestart(root); bindTemp(root);
    $('#pcStart').addEventListener('click', () => { const t = hasDraft && savedStep ? secOf(savedStep) : 0; savedStep = null; pcGo(t === 'intro' ? 0 : t); });

  }
  const sec = SECTIONS[pcSec];
  root.innerHTML = `
    <header class="pc-top"><div class="pc-in">
      <div class="brand">${logoHTML('bar-logo')}<strong>겨울특강 <em>홍보물</em> 만들기</strong><span>바이브 디자인 교육 사전 과제</span></div>
      <div class="prog"><span class="save-st" data-st="${saveSt[1]}">${saveSt[0]}</span><span><b>${pcSec + 1}</b> / ${SECTIONS.length} 단계</span><div class="bar"><i style="width:${(pcSec + 1) / SECTIONS.length * 100}%"></i></div></div>
    </div></header>
    <div class="pc-body pc-in">
      <aside class="pc-side">
        <ol class="pc-nav" id="pcNav"></ol>
        <div class="side-note">${CONFIG.DEADLINE ? `<b>제출 기한 ${esc(CONFIG.DEADLINE)}</b>` : ''}${serverMode() ? '작성 중인 내용과 파일은 자동 저장돼요. 이 링크를 다른 기기에서 열어도 이어서 쓸 수 있어요.' : '작성 중인 내용은 이 기기에 자동 저장돼요. 파일은 다시 올려야 해요.'}</div>
      </aside>
      <main class="pc-main">
        <div class="sec-h"><h1>${sec.h()}</h1>${sec.sub() ? `<p>${sec.sub()}</p>` : ''}</div>
        <div id="pcFields"></div>
        <div class="pc-foot">
          <button type="button" class="btn-o" id="pcPrev">${pcSec === 0 ? '처음으로' : '이전'}</button>
          <button type="button" class="btn-p" id="pcNext">${pcSec === 4 ? (editMode ? '수정 내용 제출하기' : '제출하기') : pcToReview ? '확인 화면으로' : '다음'}</button>
        </div>
      </main>
    </div>
    <div class="pc-foot-wrap">${footerHTML()}</div>`;
  const box = $('#pcFields');
  if (pcSec === 1) {
    box.appendChild(pcField('status'));
    const ids = courseIds(false);
    if (ids.length) {
      const hint = S.status === 'ready' ? ['특강 <em>안내 자료</em>', '갖고 계신 자료를 그대로 올려주세요.'] : S.status === 'planning' ? ['<em>정해진 것</em>만 골라주세요', '아직 정하지 않은 건 ‘미정’을 눌러주세요.'] : ['작년 자료와 <em>올해 계획</em>', '작년 자료를 올리고, 올해 정해진 것만 골라주세요.'];
      box.appendChild(el('div','pc-sub',`<h2>${hint[0]}</h2><p>${hint[1]}</p>`));
      if (ids.includes('files')) box.appendChild(pcField('files'));
      if (S.status === 'planning' || S.status === 'lastyear') {
        S.plans.forEach((P, i) => {
          const card = el('section','ccard',`<div class="chead"><h2>준비 중인 특강 <b>${i + 1}</b></h2>${S.plans.length > 1 ? `<button type="button" class="link" data-del="${i}">이 특강 삭제</button>` : ''}</div>`);
          card.appendChild(pcField(`p-basic:${i}`)); card.appendChild(pcField(`p-detail:${i}`));

          if (del) del.addEventListener('click', () => { if (!confirm(`준비 중인 특강 ${i + 1}을 삭제할까요?`)) return; S.plans.splice(i, 1); normalizeMore(); changed(); const y = scrollY; pcRender(); scrollTo(0, y); });
          box.appendChild(card);
        });
        const add = el('button','add-course','+ 준비 중인 특강 추가'); add.type = 'button';
        add.addEventListener('click', () => { S.plans.push(newPlan()); normalizeMore(); changed(); pcRender(`p-basic:${S.plans.length - 1}`); });
        box.appendChild(add);
      }
    }
  } else if (pcSec === 4) {
    C.review.mount(box);
  } else {
    secIds(pcSec).forEach(id => box.appendChild(pcField(id)));
  }
  drawNav(); pcChanged();

  $('#pcPrev').addEventListener('click', () => {
    if (pcToReview) { pcToReview = false; return pcGo(4); }
    pcGo(pcSec === 0 ? 'intro' : pcSec - 1);
  });
  $('#pcNext').addEventListener('click', () => {
    if (pcSec === 4) {
      if (!C.review.valid()) { const i = [0,1,2,3].find(k => !secOk(k)); toast('빠진 항목이 있어요. 빨간색으로 표시된 곳을 확인해 주세요.'); return pcGo(i, null, true); }
      return submit();
    }
    const bad = secIds(pcSec).filter(id => !okId(id));
    if (bad.length) {
      markBad();
      const f = $(`#pcFields .fld[data-id="${bad[0]}"]`); if (f) f.scrollIntoView({ behavior:'smooth', block:'center' });
      return toast(bad.length > 1 ? `빠진 항목이 ${bad.length}개 있어요. 빨간색으로 표시된 곳을 확인해 주세요.` : defOf(bad[0]).err);
    }
    if (pcSec === 0) S.editInfo = false;
    if (pcSec === 1) normalizeMore();
    if (pcToReview) { pcToReview = false; return pcGo(4); }

/* ═════════════ 화면 전환 ═════════════ */
let lastMode = null;
function applyMode(){
  const pc = isPC(); lastMode = pc;
  document.body.classList.toggle('is-pc', pc);
  $('.app').hidden = pc; $('#pc').hidden = !pc;
}
function rerender(){ applyMode(); if (isPC()) pcRender(); else render(); }
mq.addEventListener('change', () => {
  if (isPC() === lastMode) return;
  if (cur === 'done' || pcSec === 'done') return showDone();
  if (isPC()) { pcSec = cur === 'intro' ? 'intro' : secOf(cur); pcToReview = toReview; toReview = false; normalizeMore(); }
  else { cur = pcSec === 'intro' ? 'intro' : firstOf(pcSec); toReview = pcToReview; pcToReview = false; }
  rerender();
});

/* ═════════════ 자동 저장 ═════════════ */
/* 개인 링크(회원사 코드)로 들어오면 서버('작성중' 탭)에 저장해서 어느 기기에서 열어도 이어서 써요.
   링크 없이 들어오면 이 기기 브라우저에만 저장해요(파일 제외). */
const serverMode = () => !!(S.code && CONFIG.SCRIPT_URL && member);
let saveT = null, saving = false, saveAgain = false, saveSt = ['', ''];
const hhmm = () => { const d = new Date(); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
function setSaveStatus(t, st){ saveSt = [t, st || '']; $$('.save-st').forEach(e => { e.textContent = t; e.dataset.st = st || ''; }); }
const currentStep = () => isPC() ? (typeof pcSec === 'number' ? firstOf(pcSec) : 'intro') : cur;
const formOf = () => ({ academyName:S.academyName, address:S.address, addressDetail:S.addressDetail, phone:S.phone, status:S.status, courseText:S.courseText, plans:S.plans, slogan:S.slogan, emphasis:S.emphasis });
const fileRef = x => x && x.fileId && !x.file ? { fileId:x.fileId, name:x.name || '', mimeType:x.mimeType || x.type || '', size:x.size || 0 } : null;
const draftData = () => ({ form:formOf(), step:currentStep(), files:{ logo:fileRef(logo), courseFiles:docs.map(fileRef).filter(Boolean), photos:photos.map(fileRef).filter(Boolean) } });
const post = async (body, keepalive) => (await fetch(CONFIG.SCRIPT_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify(body), keepalive:!!keepalive })).json();

function scheduleSave(){
  if (!remoteReady || cur === 'done' || pcSec === 'done') return;
  clearTimeout(saveT);
  if (serverMode()) { setSaveStatus('저장 중…', 'ing'); saveT = setTimeout(pushDraft, 1200); }
  else saveT = setTimeout(saveLocal, 300);
}
async function pushDraft(){
  saveT = null;
  if (saving) { saveAgain = true; return; }
  saving = true;
  try {
    const r = await post({ app:'prework', action:'draft', code:S.code, draft:draftData() });
    if (!r.ok) throw new Error(r.error || 'save');
    setSaveStatus(`저장됨 ${hhmm()}`, 'ok');
  } catch (e) { console.warn(e); setSaveStatus('저장 실패', 'err'); setTimeout(scheduleSave, 5000); }
  saving = false;
  if (saveAgain) { saveAgain = false; pushDraft(); }
}
/* 창을 닫거나 다른 앱으로 넘어갈 때 기다리던 저장을 바로 보냄 */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'hidden' || !saveT || !serverMode()) return;
  clearTimeout(saveT); saveT = null;
  try { post({ app:'prework', action:'draft', code:S.code, draft:draftData() }, true).catch(() => {}); } catch (e) {}
});

/* 파일은 고르는 즉시 학원 폴더에 올림 → 다른 기기에서도 보이게 */
function uploadItem(item, kind){
  if (!serverMode() || !item || !item.file) return;
  item.uploading = true; item.failed = false;
  item.promise = (async () => {
    try {
      const f = item.file, isImg = (f.type || '').startsWith('image/');
      const file = kind === 'photo' ? await compressImage(f, CONFIG.PHOTO_MAX_PX, 0.85)
        : kind === 'doc' && isImg ? await compressImage(f, CONFIG.DOC_IMG_MAX_PX, 0.9) : await raw(f);
      const r = await post({ app:'prework', action:'upload', code:S.code, kind, file });
      if (!r.ok || !r.file) throw new Error(r.error || 'upload');
      Object.assign(item, { remote:true, fileId:r.file.fileId, mimeType:r.file.mimeType || item.mimeType || item.type });
      delete item.file;
    } catch (e) { console.warn(e); item.failed = true; toast('파일을 올리지 못했어요. 제출할 때 다시 올릴게요.'); }
    item.uploading = false; delete item.promise;
    refreshFileViews(); changed();
  })();
}
const fileState = d => d.uploading ? '올리는 중…' : d.failed ? '제출할 때 올려요' : d.remote ? (serverMode() ? '저장됨' : '제출한 파일') : fmtSize(d.size);
function refreshFileViews(){
  const targets = [];
  if (isPC()) {
    if (typeof pcSec !== 'number') return;
    if (pcSec === 4) { const b = $('#pcFields'); if (b) C.review.mount(b); return; }
    ['info', 'files', 'photos'].forEach(id => { const fb = $(`#pcFields .fld[data-id="${id}"] .fb`); if (fb) targets.push([id, fb]); });
  } else if (current && ['info', 'files', 'photos', 'review'].includes(cur)) targets.push([cur, current]);
  targets.forEach(([id, box]) => { if (box._redraw) box._redraw(); else C[id].mount(box, 0); });
}

/* 이 기기에만 저장 (링크 없이 들어온 경우) */
const draftKey = () => CONFIG.DRAFT_KEY + (S.code ? ':' + S.code : '');
function saveLocal(){
  if (cur === 'done' || pcSec === 'done' || editMode || serverMode()) return;
  const step = currentStep();
  if (step === 'intro' && !hasDraft) return;
  try { localStorage.setItem(draftKey(), JSON.stringify({ t:Date.now(), step, s:S })); } catch(e) {}
}
function clearDraft(){ try { localStorage.removeItem(draftKey()); } catch(e) {} }
const savedKey = () => CONFIG.SAVED_KEY + (S.code ? ':' + S.code : '');
function getSaved(){ try { return JSON.parse(localStorage.getItem(savedKey()) || 'null'); } catch(e) { return null; } }
function setSaved(sid, token){ try { localStorage.setItem(savedKey(), JSON.stringify({ sid, token })); } catch(e) {} }
function loadDraft(){
  try {
    const d = JSON.parse(localStorage.getItem(draftKey()) || 'null'); if (!d || !d.s) return;
    Object.assign(S, d.s); S.plans = (Array.isArray(d.s.plans) && d.s.plans.length ? d.s.plans : [d.s.plan || {}]).map(p => Object.assign(newPlan(), p)); delete S.plan; S.editInfo = false;
    hasDraft = true; savedStep = d.step && d.step !== 'intro' ? d.step : null;
  } catch(e) {}
}

/* ═════════════ 회원사 정보 미리 채우기 ═════════════ */
function applyMember(m){
  member = m;
  if (!hasDraft && !submission) {
    S.academyName = m.academyName || ''; S.address = m.address || ''; S.phone = fmtPhone(m.phone || '');
    if (m.slogan) S.slogan = m.slogan;
  }
  S.prefilled = true;
  if (!logo && m.logo && m.logo.data) {
    logo = { url:`data:${m.logo.mimeType};base64,${m.logo.data}`, name:m.logo.name, size:0, mimeType:m.logo.mimeType, fileId:m.logo.fileId, prefilled:true };
  } else if (!logo && m.logo && m.logo.fileId) {
    logo = { url:'', name:m.logo.name || '등록된 로고', size:0, mimeType:m.logo.mimeType || '', fileId:m.logo.fileId, prefilled:true };
  }
}
function applyForm(f){
  Object.assign(S, {
    academyName:f.academyName || '', address:f.address || '', addressDetail:f.addressDetail || '', phone:f.phone || '',
    status:f.status || null, courseText:f.courseText || '', slogan:f.slogan || '', emphasis:f.emphasis || '', editInfo:false
  });
  S.plans = (Array.isArray(f.plans) && f.plans.length ? f.plans : [{}]).map(x => Object.assign(newPlan(), x));
}
function applyFiles(sub){
  logo = null;
  if (sub.logo) logo = { remote:true, fileId:sub.logo.fileId, name:sub.logo.name || '제출한 로고', size:0, mimeType:sub.logo.mimeType || '', url:sub.logo.preview || '', prefilled:false };
  docs = (sub.courseFiles || []).map(x => ({ remote:true, fileId:x.fileId, name:x.name || '제출한 파일', size:x.size || 0, type:x.mimeType || '', url:x.preview || null }));
  photos = (sub.photos || []).map(x => ({ remote:true, fileId:x.fileId, name:x.name || '', type:x.mimeType || '', url:x.preview || '' }));
}
function applySubmission(sub){
  submission = { submitId:sub.submitId, token:sub.token, submittedAt:sub.submittedAt, updatedAt:sub.updatedAt || '' };
  setSaved(sub.submitId, sub.token);
  applyForm(sub.form || {}); applyFiles(sub);
  hasDraft = false; savedStep = null; clearDraft();
}
function applyDraft(d){
  applyForm(d.form || {});
  const hasFiles = d.logo || (d.courseFiles || []).length || (d.photos || []).length;
  if (hasFiles || submission) { const keep = logo; applyFiles(d); if (!logo && keep && keep.prefilled) logo = keep; }
  savedStep = d.step && d.step !== 'intro' ? d.step : null;
  hasDraft = !submission && !!savedStep;
}
function setLoading(v){
  loading = v;
  document.body.classList.toggle('is-loading', v);
  $('#loadBar').hidden = !v;
  refresh();
}
async function loadRemote(){
  const saved = getSaved();
  if (!CONFIG.SCRIPT_URL || (!S.code && !saved)) { remoteReady = true; return; }
  setLoading(true);
  try {
    const q = 'app=prework&' + (S.code ? `code=${encodeURIComponent(S.code)}` : `sid=${encodeURIComponent(saved.sid)}&token=${encodeURIComponent(saved.token)}`);
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 20000);
    const res = await fetch(`${CONFIG.SCRIPT_URL}?${q}`, { signal:ctl.signal });
    clearTimeout(t);
    const out = await res.json();
    if (out.ok && out.member) applyMember(out.member);
    if (out.ok && out.submission) applySubmission(out.submission);
    if (out.ok) practice = out.practice || null;
    if (out.ok && out.draft && member) {
      const subAt = submission ? new Date(submission.updatedAt || submission.submittedAt) : null;
      if (!subAt || new Date(out.draft.updatedAt) > subAt) { applyDraft(out.draft); pendingEdit = !!submission; }
    }
  } catch (e) { console.warn('정보를 불러오지 못했어요', e); if (S.code) setTimeout(() => toast('학원 정보를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.'), 300); }
  if (!serverMode() && !submission) loadDraft();
  setLoading(false); remoteReady = true;
  if (serverMode()) setSaveStatus(hasDraft || pendingEdit ? '저장됨' : '', 'ok');
  if (submission) showDone('returning'); else rerender();
}

/* ═════════════ 제출 ═════════════ */
function fileToBase64(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1]);
    r.onerror = () => rej(new Error('파일을 읽지 못했어요: ' + file.name));
    r.readAsDataURL(file);
  });
}
function compressImage(file, maxPx, q){
  return new Promise(res => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, maxPx / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      res({ name:file.name.replace(/\.[^.]+$/, '') + '.jpg', mimeType:'image/jpeg', data:cv.toDataURL('image/jpeg', q).split(',')[1] });
    };
    img.onerror = async () => { URL.revokeObjectURL(url); res({ name:file.name, mimeType:file.type || 'application/octet-stream', data:await fileToBase64(file) }); };
    img.src = url;
  });
}
const raw = async f => ({ name:f.name, mimeType:f.type || 'application/octet-stream', data:await fileToBase64(f) });

async function submit(){
  if (!CONFIG.SCRIPT_URL) { toast('제출 주소(SCRIPT_URL)가 아직 설정되지 않았어요.'); return; }
  const ov = $('#overlay'); ov.classList.add('on');
  clearTimeout(saveT); saveT = null;
  try {
    await Promise.all([logo, ...docs, ...photos].filter(x => x && x.promise).map(x => x.promise));
    const hasDocs = S.status === 'ready' || S.status === 'lastyear', hasPlan = S.status === 'planning' || S.status === 'lastyear';
    const infoEdited = !member ? null : (member.academyName || '') !== S.academyName || (member.address || '') !== S.address || fmtPhone(member.phone || '') !== S.phone || filled(S.addressDetail) || !!(logo && logo.file);
    const isEdit = !!submission;
    const payload = {
      app: 'prework',   // 유미니 체험 신청과 같은 웹앱을 써서, 사전과제 요청임을 알려요
      submitId: submission ? submission.submitId : Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 5).toUpperCase(),
      token: submission ? submission.token : (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36)),
      isEdit,
      form: { academyName:S.academyName, address:S.address, addressDetail:S.addressDetail, phone:S.phone, status:S.status, courseText:S.courseText, plans:S.plans, slogan:S.slogan, emphasis:S.emphasis },
      code: S.code,
      academyName: S.academyName.trim(),
      address: [S.address.trim(), S.addressDetail.trim()].filter(Boolean).join(' '),
      phone: S.phone.trim(),
      infoEdited,
      status: S.status,
      courseText: hasDocs ? S.courseText.trim() : '',
      courseFiles: hasDocs ? await Promise.all(docs.map(d => !d.file ? { keepId:d.fileId, name:d.name } : d.type.startsWith('image/') ? compressImage(d.file, CONFIG.DOC_IMG_MAX_PX, 0.9) : raw(d.file))) : [],
      plans: hasPlan ? S.plans.map(P => ({
        subjects: P.subjects.map(x => x === '기타' && filled(P.subjectEtc) ? `기타(${P.subjectEtc.trim()})` : x),
        targets: P.targets,
        period: P.periodTbd ? '미정' : P.period.trim(),
        days: P.daysTbd ? '미정' : P.days.join('·'),
        time: P.timeTbd ? '미정' : P.time.trim(),
        fee: P.feeTbd ? '미정' : P.fee.trim(),
        memo: P.memo.trim()
      })) : [],
      slogan: S.slogan.trim(),
      emphasis: S.emphasis.trim(),
      logo: logo && logo.file ? await raw(logo.file) : null,
      logoFileId: logo && !logo.file ? logo.fileId || '' : '',
      photos: await Promise.all(photos.map(p => p.file ? compressImage(p.file, CONFIG.PHOTO_MAX_PX, 0.85) : { keepId:p.fileId })),
      userAgent: navigator.userAgent
    };
    const res = await fetch(CONFIG.SCRIPT_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify(payload) });
    const out = await res.json().catch(() => ({ ok:false }));
    if (!out.ok) throw new Error(out.error || '제출 실패');
    const now = new Date().toISOString();
    submission = { submitId:out.id || payload.submitId, token:out.token || payload.token, submittedAt:submission ? submission.submittedAt : now, updatedAt:isEdit ? now : '' };
    setSaved(submission.submitId, submission.token);
    // 이번에 올린 파일은 화면에 그대로 두고, 다음 수정 때는 서버에 있는 파일로 다뤄요
    if (out.files) {
      if (out.files.logo && logo) Object.assign(logo, { remote:true, fileId:out.files.logo });
      (out.files.courseFiles || []).forEach((id, i) => { if (docs[i] && id) Object.assign(docs[i], { remote:true, fileId:id }); });
      (out.files.photos || []).forEach((id, i) => { if (photos[i] && id) Object.assign(photos[i], { remote:true, fileId:id }); });
      if (logo) delete logo.file; docs.forEach(d => delete d.file); photos.forEach(p => delete p.file);
    }
    clearDraft(); pendingEdit = false; setSaveStatus('', '');
    showDone(isEdit ? 'updated' : 'thanks');
  } catch (err) {
    console.error(err);
    toast('제출하지 못했어요. 인터넷 연결을 확인하고 다시 눌러주세요.');
  } finally {
    ov.classList.remove('on'); refresh();
  }
}
function showDone(kind){
  if (kind) doneKind = kind;
  cur = 'done'; pcSec = 'done'; editMode = false; toReview = false; pcToReview = false;
  applyMode();
  if (isPC()) { pcRender(); window.scrollTo(0, 0); return; }
  $('#top').style.visibility = 'hidden'; $('#cta').hidden = true;
  screen.classList.add('nocta'); screen.innerHTML = doneHTML() + footerHTML(); bindDone(screen); window.scrollTo(0, 0);
}

/* ═════════════ 시작 ═════════════ */
S.code = (new URLSearchParams(location.search).get('code') || '').trim();
if (!S.code) loadDraft();
rerender();
loadRemote();
</script>
